name: Build CP assets

on:
  push:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        # statamic/cms is pulled in as a real Composer dependency purely so
        # npm can resolve @statamic/cms via the local file: path below --
        # it's the same package.json the addon's own vendor/statamic/cms
        # ships (see vite.config.js / package.json).
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Commit rebuilt dist/ if it changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild CP assets [skip ci]"
          file_pattern: dist/**
